[package]
name = "archwarden-mcp"
description = "archwarden as an MCP server: a thin shell over the same operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# The whole dependency list, and the point of the crate. `archwarden-cli` is
# deliberately absent: a server that could reach the CLI would eventually
# answer a question from there instead of from the operations, and the two
# surfaces would drift. Nothing here can, because nothing here can see it.
archwarden-api = { workspace = true }
archwarden-core = { workspace = true }
camino = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
