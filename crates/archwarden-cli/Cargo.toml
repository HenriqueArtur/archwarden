[package]
name = "archwarden-cli"
description = "A fast, declarative architecture linter for TypeScript and JavaScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
archwarden-api = { workspace = true }
archwarden-config = { workspace = true }
archwarden-core = { workspace = true }
# archwarden-cache is not here: the CLI no longer opens a cache, decides
# whether one is worth opening, or knows where it lives. archwarden-api does
# all three and hands back a note when it could not. Issue #63.
archwarden-engine = { workspace = true }
# The MCP surface. It depends on `archwarden-api` and cannot see this crate,
# which is what keeps a server from answering a question from the wrong place.
archwarden-mcp = { workspace = true }
archwarden-rules = { workspace = true }
archwarden-resolver = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
jsonc-parser = { workspace = true }
# `fancy` is what renders the source span and the underline. It is the whole
# reason miette is here rather than anyhow.
miette = { workspace = true, features = ["fancy"] }
# Only to classify a config error as syntax-or-not; see diagnostic.rs.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
name = "archwarden_cli"
path = "src/lib.rs"

[[bin]]
name = "archwarden"
path = "src/main.rs"
