[package]
name = "archwarden-cli"
description = "A fast, declarative architecture linter for TypeScript and JavaScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
archwarden-config = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
# `fancy` is what renders the source span and the underline. It is the whole
# reason miette is here rather than anyhow.
miette = { workspace = true, features = ["fancy"] }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[lib]
name = "archwarden_cli"
path = "src/lib.rs"

[[bin]]
name = "archwarden"
path = "src/main.rs"
