[package]
name = "archwarden-api"
description = "The operations behind archwarden's surfaces: one implementation, errors as values."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
archwarden-cache = { workspace = true }
archwarden-config = { workspace = true }
archwarden-core = { workspace = true }
archwarden-engine = { workspace = true }
archwarden-resolver = { workspace = true }
# `describe` asks every rule what it requires of a path, which means building
# the engines a config compiles to. It moved here with the operation: a surface
# that asked the question through its own engine list would be answering it a
# second way, and the two would drift.
archwarden-rules = { workspace = true }
camino = { workspace = true }
# The baseline is a committed file with a schema of its own, so the crate that
# owns the operation owns its format too.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
