name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for a dry run"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Every `actions/*` here runs on the Node 24 runtime, which needs Actions
# Runner v2.327.1 or newer. GitHub-hosted runners are current; a self-hosted
# one would have to be updated before this workflow runs on it.
jobs:
  # Every target builds on a runner of its own architecture, rather than
  # cross-compiling from one.
  #
  # `blake3` compiles C for its SIMD paths, so a cross-compile needs a C
  # cross-toolchain per target -- either a docker image or a linker install,
  # both of which are machinery to maintain for something GitHub already
  # offers. `ubuntu-24.04-arm` made the arm64 half native, and musl only needs
  # `musl-tools` for the architecture it is already on.
  #
  # The one real cross-compile is x86_64 macOS from an arm64 runner, which
  # Apple's own toolchain handles: its SDK carries both architectures.
  build:
    name: 🔨 ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # Linux is musl only. A glibc build links against whatever the
          # runner has, which made 0.3.0 require 2.39 and refuse to start on
          # Debian 12 -- a floor nobody chose. See decision 14.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools
            cc: musl-gcc
            containers: "debian:11 alpine:3.19"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            packages: musl-tools
            cc: musl-gcc
            containers: "debian:11 alpine:3.19"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: install the musl C toolchain
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      # `blake3` compiles C, and `cc-rs` treats a musl target on a gnu host as
      # a cross-compile even when the architectures match: it derives a tool
      # name from the triple. For `x86_64-unknown-linux-musl` its candidate
      # list ends in plain `musl`, so `musl-gcc` is found; for
      # `aarch64-unknown-linux-musl` the table says `aarch64-linux-musl` with
      # no fallback, and `musl-tools` does not ship that name. The build fails
      # with `failed to find tool "aarch64-linux-musl-gcc"`.
      #
      # `CC_<target>` is read before that table, and on a runner of the same
      # architecture `musl-gcc` *is* the right compiler. Set for both musl
      # targets rather than only the one that needs it, so neither depends on
      # a lookup table in someone else's crate.
      - name: name the musl compiler
        if: matrix.cc
        run: |
          echo "CC_${{ matrix.target }}=${{ matrix.cc }}" >> "$GITHUB_ENV"

      # Derived once, for every step below. A dispatch names its own tag; a tag
      # push is named by the ref. Written as an `if` rather than
      # `[ -n ... ] && VERSION=...` because that form's exit status is the
      # step's, the day someone moves it to the last line.
      - name: name the version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      # `--locked` on purpose: a release must be built from the dependency
      # versions the tests ran against, not from whatever resolved today.
      - run: cargo build --release --locked --target ${{ matrix.target }} -p archwarden-cli

      # A binary that will not print its own version is not one to publish, and
      # one that prints the *wrong* version is worse: nothing downstream would
      # notice. The archive is named from the tag and `build.mjs` finds it by
      # that name, so a workspace nobody bumped ships as the new version with
      # the old binary inside, silently. Caught here, once per target.
      #
      # Skipped where the build was a cross-compile and cannot run here.
      - name: check the binary runs, and is the version being released
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/archwarden"
          if [ "${{ matrix.archive }}" = "zip" ]; then BIN="$BIN.exe"; fi

          REPORTED="$("$BIN" --version)"
          echo "$REPORTED"
          if [ "$REPORTED" != "archwarden $VERSION" ]; then
            echo "::error::the tag says $VERSION and the binary says '$REPORTED'; bump the version in Cargo.toml"
            exit 1
          fi

      # The check that would have caught 0.3.0, and the reason it did not
      # exist: every check archwarden had ran on a machine shaped like the
      # runner, so a binary that only worked on the runner passed all of them.
      #
      # `debian:11` is glibc 2.31 -- older than Debian 12, Ubuntu 22.04 and
      # every `node:` image, so passing there covers all of them. `alpine` has
      # no glibc at all. Between them they are the two ways a Linux binary
      # fails to start, and both are checked before anything is published.
      - name: run the binary on an old glibc and on musl
        if: matrix.containers
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/archwarden"
          for image in ${{ matrix.containers }}; do
            echo "--- $image"
            # Piped in rather than bind-mounted: a mount depends on the daemon
            # seeing the same filesystem, which is one more thing that can be
            # true on one machine and not another. This form was the one
            # verified locally against the published 0.2.0, 0.3.0 and musl
            # binaries, and it reproduced the failure and the fix exactly.
            cat "$BIN" | docker run -i --rm "$image" \
              sh -c 'cat > /archwarden && chmod +x /archwarden && /archwarden --version'
          done

      - name: package
        shell: bash
        run: |
          NAME="archwarden-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/archwarden.exe" "dist/$NAME/"
            (cd dist && 7z a "$NAME.zip" "$NAME")
          else
            cp "target/${{ matrix.target }}/release/archwarden" "dist/$NAME/"
            (cd dist && tar czf "$NAME.tar.gz" "$NAME")
          fi

          # Checksums travel with the archive so an installer can verify what
          # it downloaded without a second round trip. Through `python3`
          # rather than `shasum`, which on the Windows runner is whatever Git
          # for Windows happened to install.
          python3 scripts/checksum.py dist "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: 🚀 publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A dry run builds every target and stops there, which is the point of
    # having one.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # `download-artifact` v8 fails on a hash mismatch rather than warning,
      # which is what you want when the bytes downloaded here become the
      # binaries inside six published npm packages.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    name: 📦 publish the npm packages
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # `download-artifact` v8 fails on a hash mismatch rather than warning,
      # which is what you want when the bytes downloaded here become the
      # binaries inside six published npm packages.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Six packages: the one people install, and five carrying a binary
      # each. No postinstall anywhere -- pnpm 10 blocks dependencies' install
      # scripts by default, so a package that downloaded its binary would
      # install silently without one, and fail at first run in someone else's
      # terminal.
      - name: unpack the archives
        run: |
          cd dist
          for archive in *.tar.gz; do tar xzf "$archive"; done
          for archive in *.zip; do unzip -q "$archive"; done

      - name: check the wrapper before publishing it
        working-directory: npm/archwarden
        run: node --test "test/*.test.mjs"

      - name: build the packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node npm/build.mjs dist npm/dist "$VERSION"

      - name: is there a token?
        id: token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set; nothing was published to npm"
          fi

      # Platform packages first. The main package's `optionalDependencies`
      # name them at an exact version, so publishing it first would leave a
      # window where installing it resolves to nothing.
      - name: publish
        if: steps.token.outputs.present == 'true'
        run: |
          for package in npm/dist/cli-*; do
            (cd "$package" && npm publish --access public)
          done
          (cd npm/dist/archwarden && npm publish --access public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
