name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand, and not only for convenience: during the GitHub Actions
  # incident of 2026-08-06, webhook delivery was throttled to ~15% and pull
  # request events created no run at all for hours. A dispatch goes through
  # the API instead, so CI stays reachable when the trigger that normally
  # reaches it does not. `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # rustc version comes from rust-toolchain.toml, which pins it for every job
  # here and for every contributor. That is also what verifies the MSRV
  # declared in Cargo.toml -- there is no separate MSRV job because there is no
  # second version in play.

  lint:
    name: 🎨 format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The published JSON Schema is generated from the config types and
      # committed, because editors fetch it by URL. Without this check a field
      # added to a rule would silently stop appearing in completion, and nobody
      # would notice until a user filed a bug.
      - run: cargo xtask check-schema

  test:
    name: 🧪 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs each test in its own process, so one panic cannot take the
      # suite with it, and reports failures in a readable form. It also treats
      # "zero tests ran" as an error, which on a project where TDD is mandatory
      # is exactly right.
      - run: cargo nextest run --workspace --all-features
      # nextest does not run doctests; they are tests too.
      - run: cargo test --workspace --doc

  coverage:
    name: 📊 coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # docs/TESTING.md requires every branch of every rule kind to be covered.
      # The floors are enforced, not advisory. Never lower one to make a red
      # build green: either write the test, or delete the unreachable code the
      # test cannot reach.
      #
      # archwarden-core is held as close to 100% as the tool can measure. It is
      # pure logic with no I/O, so an uncovered line means either a missing
      # test or a branch no input can take, and both deserve to fail the build.
      #
      # The line floor is 99 rather than 100, and that is a limitation of
      # cargo-llvm-cov rather than a concession. Its summary reports one missed
      # line in glob.rs that its own lcov, JSON and HTML reports all show as
      # covered -- a phantom inside macro-expanded code. Chasing it produced
      # several real tests and never moved the number.
      #
      # The function floor stays at 100 and is the stricter half of the pair:
      # deleting a test drops function coverage immediately, which a line floor
      # of 99 could absorb. See docs/PLAN-V0.md.
      - run: >
          cargo llvm-cov -p archwarden-core --all-features
          --fail-under-lines 99
          --fail-under-functions 100

      # archwarden-api is held to the same pair, and it is the one crate here
      # that touches the filesystem under that bar. Deliberate: it is the
      # boundary every surface goes through, so a branch nothing tests is a
      # branch the CLI, the hook and MCP all inherit at once. Issue #63 moved
      # this code out of archwarden-cli, where the 95 floor would have let a
      # whole error variant arrive untested.
      #
      # It is affordable because nothing in the crate writes: every stage
      # returns a value, so reaching a branch means constructing an input, not
      # arranging a terminal.
      #
      # The function floor is 99 here and 100 for the core, and the one
      # function is named rather than left as slack. `Baseline::write` maps the
      # error of `serde_json::to_string_pretty(self)`, and `Baseline` is a
      # `Vec<Entry>` of three `String`s: serde_json fails on non-string map
      # keys, on non-finite floats, and on a `Serialize` that errors, and this
      # type has none of the three. It is not a missing test, it is a branch no
      # input reaches, and `?` cannot be written without handling it.
      # `#[coverage(off)]` would say exactly that, and is nightly-only.
      #
      # The cost, stated: one more uncovered function could hide behind this.
      # If the number ever moves off 173 of 174, find out which one before
      # touching the floor.
      - run: >
          cargo llvm-cov -p archwarden-api --all-features
          --fail-under-lines 99
          --fail-under-functions 99

      # Everything else: 95% is the floor, 100% the aim. The crates that touch
      # the filesystem, the terminal and node_modules have edges that cost more
      # to reach than they are worth.
      #
      # The regex is unanchored on purpose: llvm-cov matches it against
      # absolute paths, so '^xtask/' silently matches nothing.
      - run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex 'xtask/'
          --fail-under-lines 95

  supply-chain:
    name: ⚖️ licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licence allowlist lives in deny.toml and derives from decision 11.
      - run: cargo deny check

  hygiene:
    name: 🧹 unused deps and typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,typos-cli
      - run: cargo machete
      - run: typos

  distribution:
    name: 📦 the install routes
    runs-on: ubuntu-latest
    # The release workflow cannot be run on a pull request, but the pieces it
    # depends on can: the shim that decides which archive to download, and the
    # script that writes checksums into the formula. Both fail on a stranger's
    # machine, days later, if they are wrong.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: the npm wrapper
        working-directory: npm/archwarden
        run: node --test "test/*.test.mjs"
      - name: the release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  future-rust:
    name: 🔮 latest stable (advisory)
    runs-on: ubuntu-latest
    # Early warning that a future rustc breaks us. Never blocks a merge: the
    # pinned toolchain is what we actually ship.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - run: cargo test --workspace --all-features

  differential:
    name: 🔬 differential vs dependency-cruiser
    runs-on: ubuntu-latest
    # Tier 3 in docs/TESTING.md, and here rather than on a schedule.
    #
    # It was a nightly. It failed every night for at least six days with
    # `ARCHWARDEN_DIFF_REPO=` is not a readable path -- an unset repository
    # variable substitutes as the empty string -- and nobody opened the
    # report. That is the same argument docs/TESTING.md already makes for
    # moving mutation testing onto the push hook: a red job nobody reads is
    # not a test, it is a habit of ignoring red.
    #
    # Target repositories are private and configured through the
    # `ARCHWARDEN_DIFF_REPO` repository variable rather than checked in. With
    # none configured the test says why it did nothing and passes, so this job
    # costs a compile and stays honest -- an `if: false` job rots, and so does
    # one that has been failing so long its failure means nothing.
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # dependency-cruiser resolves TypeScript through the *target* repo's own
      # typescript, so it is installed there rather than globally. It needs
      # TypeScript 5: dependency-cruiser 18 declares `>=2 <7` and silently
      # cruises nothing when only 7 is present.
      - name: install the reference tool into the target
        if: vars.ARCHWARDEN_DIFF_REPO != ''
        run: npm install --no-audit --no-fund dependency-cruiser typescript@5
        working-directory: ${{ vars.ARCHWARDEN_DIFF_REPO }}
      - run: cargo test -p archwarden-engine --features differential -- --nocapture
        env:
          ARCHWARDEN_DIFF_REPO: ${{ vars.ARCHWARDEN_DIFF_REPO }}
          ARCHWARDEN_DIFF_DIRS: ${{ vars.ARCHWARDEN_DIFF_DIRS }}
