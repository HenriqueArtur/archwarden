# What mutation testing is not asked to prove.
#
# # Where this file goes
#
# `.cargo/mutants.toml`, not `mutants.toml` at the root. It lived at the root
# for two releases and was read by nothing: the exclusions below were written,
# documented at length, believed, and inert. `cargo mutants --list` still
# offered 102 mutants from a file this says to skip.
#
# It never blocked a push, which is why it went unnoticed — the hook runs
# `--in-diff`, and those files stopped appearing in diffs. A configuration that
# is doing nothing looks exactly like one whose rules are satisfied, which is
# the failure `CONFIG.md` names as the worst a linter has, arrived at from the
# other side.
#
# `cargo mutants --list` is how to check: if a path named here still appears,
# this file is not being read.
#
# `cargo-mutants` runs on the push hook, over the diff being pushed. It earns
# its place on logic: a comparison flipped, a branch inverted, a count off by
# one. Everything below is a place where the tool can generate a mutant that no
# honest test would catch, and the test that would catch it is worse than the
# mutant.

exclude_globs = [
    # The translation tables.
    #
    # Every method in these files returns a constant string, so the tool offers
    # two mutants each: `""` and `"xyzzy"`.
    #
    # The `""` half is a real defect -- a section with no heading, a legend with
    # no label -- and `phrases::tests::no_language_leaves_a_phrase_blank`
    # catches all of it, in both languages, by name.
    #
    # The `"xyzzy"` half can only be caught by asserting each phrase against its
    # own literal. That test would fail on every copy edit, would be updated by
    # pasting the new string in, and would prove exactly one thing: that the
    # string is the string. It is a change detector wearing a test's clothes,
    # and 190 of them would teach a contributor that a red hook means "paste it
    # again".
    #
    # These files are data. The trait they implement is not: `phrases/mod.rs`
    # holds `plural`, `Language::of` and `tag`, and stays mutated.
    "crates/archwarden-cli/src/phrases/en.rs",
    "crates/archwarden-cli/src/phrases/pt_br.rs",
]

# One mutant, named exactly, because no test can kill it and the reason is
# worth more written down than worked out again.
#
# `single.rs` guards its parse with `needs_facts && is_source`. Widen that to
# `||` and both new paths reach the same answer: with `needs_facts` false the
# facts are computed and never read, and with `is_source` false the parser
# refuses the extension and returns `None` — which is what the guard would have
# produced. The `Single` that comes out is identical either way, so a test
# distinguishing them would have to assert on work done rather than on an
# answer, and that is a test of the implementation.
#
# The guard stays because reading a file to be told it is the wrong kind is
# work with no reason, and on a binary that happened to match a `file_pattern`
# it is a large one. The argument is at the line itself; this entry is the same
# argument in the form the hook can act on.
#
# The same shape appears once more in the project, at the parser guard in
# `run.rs`, and the argument there is written at the line.
# # Three entries, and whether that is a pattern
#
# A note above once said a third exclusion would be worth a rethink rather than
# a third entry. This is the third, so: the reasons are three different ones,
# and none of them is "mutation testing is inconvenient here".
#
#   the phrase tables   data rather than logic; the test that kills those
#                       mutants asserts a string is itself
#   the parser guard    unobservable; both paths reach the same answer, so no
#                       test can tell them apart
#   `ci::run`           untestable by recursion; the test would run the suite
#                       that contains it
#   `mutants::run`      the same recursion, one turn tighter: it runs
#   `mutants::pending`  cargo-mutants over this workspace, so a test calling
#                       either would run cargo-mutants over the test
#
# The last two share `ci::run`'s reason rather than adding one, which is the
# bar this list sets for itself. Another sharing one of these reasons would be
# fine. One with a new reason is worth stopping for.
#
# # A fourth reason, stopped for
#
# `the mutant is the original`. A method whose entire body is a constant --
# `false`, `Vec::new()` -- offers a mutant replacing it with that same constant.
# There is no behaviour between the two, so no test can distinguish them, and
# the exclusion is not a judgement about whether the code deserves a test. It
# is arithmetic.
#
# This is a different claim from the parser guard above, which has two *paths*
# reaching one answer. Here there is one path, and the tool has rewritten it as
# itself.
#
# Named individually rather than by a pattern, because a method whose body is a
# constant *today* may not be one tomorrow -- and if it grows a branch, this
# entry should stop matching and the mutant should come back.

exclude_re = [
    "single\\.rs:\\d+:\\d+: replace && with \\|\\| in check",
    # `ci::run` replaced by `Ok(())`, which is a gate runner reporting success
    # without running anything -- the exact failure that task exists to refuse,
    # and not harmless at all.
    #
    # It is here because the test that kills it cannot exist. `run` executes
    # this repository's thirteen gates, and one of them is `cargo nextest run
    # --workspace`. A test calling `run` would run the suite that contains it.
    #
    # What is left inside `run` after that is wiring over three pieces that are
    # each tested on their own: `Mode::parse`, the missing-tool refusal, and
    # `run_gates`, which is separate precisely so a test can hand it gates that
    # are not this repository's. The mutant survives the wiring, not the
    # behaviour.
    "ci\\.rs:\\d+:\\d+: replace run -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
    # `mutants::run` and `mutants::pending`, for `ci::run`'s reason one turn
    # tighter. Both shell out to `cargo mutants` over *this* workspace, so a
    # test calling either would run cargo-mutants over the suite containing
    # the test -- and each mutated run of it again.
    #
    # What is left inside them after that is wiring over pieces that are each
    # tested on their own: `base`, `pull_request_base`, `diff_against`,
    # `untracked_sources`, `write_diff`, `count_listed`, `missed_from`,
    # `verdict_of` and `report`. The mutants survive the wiring, not the
    # behaviour -- and the wiring is what every `cargo xtask ci` in this
    # repository exercises, which is how both real bugs in it were found: a
    # survivor list read from the wrong directory, and an untracked file
    # producing no mutants at all.
    "mutants\\.rs:\\d+:\\d+: replace run -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
    "mutants\\.rs:\\d+:\\d+: replace pending -> Result<usize, String> with Ok\\(\\d+\\)",
    "mutants\\.rs:\\d+:\\d+: delete ! in pending",
    "mutants\\.rs:\\d+:\\d+: delete ! in run",
    # The mutant is the original: each of these has a body that already *is*
    # the value the tool substitutes.
    #
    # `check_repository`'s default returns `Vec::new()`, and a rule that never
    # asked for the repository is asked nothing -- that is the default's whole
    # content.
    #
    # `call-matches-export` answers `false` and `Vec::new()` to the two
    # per-file questions on purpose: no file individually satisfies or violates
    # an agreement between two vocabularies, and the honest answer to "what does
    # this rule require of this path" is nothing, because the other half is
    # somewhere else and may not exist yet. `docs/RULES.md` says so and
    # `it_asks_about_the_repository_and_claims_no_file` asserts it.
    "traits\\.rs:\\d+:\\d+: replace RuleEngine::check_repository -> Vec<Finding> with vec!\\[\\]",
    "call_matches_export\\.rs:\\d+:\\d+: replace <impl RuleEngine for CallMatchesExportEngine>::applies_to -> bool with false",
    "call_matches_export\\.rs:\\d+:\\d+: replace <impl RuleEngine for CallMatchesExportEngine>::describe_expectation -> Vec<Expectation> with vec!\\[\\]",
]
