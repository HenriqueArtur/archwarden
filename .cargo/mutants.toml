# What mutation testing is not asked to prove.
#
# # Where this file goes
#
# `.cargo/mutants.toml`, not `mutants.toml` at the root. It lived at the root
# for two releases and was read by nothing: the exclusions below were written,
# documented at length, believed, and inert. `cargo mutants --list` still
# offered 102 mutants from a file this says to skip.
#
# It never blocked a push, which is why it went unnoticed — the hook runs
# `--in-diff`, and those files stopped appearing in diffs. A configuration that
# is doing nothing looks exactly like one whose rules are satisfied, which is
# the failure `CONFIG.md` names as the worst a linter has, arrived at from the
# other side.
#
# `cargo mutants --list` is how to check: if a path named here still appears,
# this file is not being read.
#
# `cargo-mutants` runs on the push hook, over the diff being pushed. It earns
# its place on logic: a comparison flipped, a branch inverted, a count off by
# one. Everything below is a place where the tool can generate a mutant that no
# honest test would catch, and the test that would catch it is worse than the
# mutant.

exclude_globs = [
    # The translation tables.
    #
    # Every method in these files returns a constant string, so the tool offers
    # two mutants each: `""` and `"xyzzy"`.
    #
    # The `""` half is a real defect -- a section with no heading, a legend with
    # no label -- and `phrases::tests::no_language_leaves_a_phrase_blank`
    # catches all of it, in both languages, by name.
    #
    # The `"xyzzy"` half can only be caught by asserting each phrase against its
    # own literal. That test would fail on every copy edit, would be updated by
    # pasting the new string in, and would prove exactly one thing: that the
    # string is the string. It is a change detector wearing a test's clothes,
    # and 190 of them would teach a contributor that a red hook means "paste it
    # again".
    #
    # These files are data. The trait they implement is not: `phrases/mod.rs`
    # holds `plural`, `Language::of` and `tag`, and stays mutated.
    "crates/archwarden-cli/src/phrases/en.rs",
    "crates/archwarden-cli/src/phrases/pt_br.rs",
]

# One mutant, named exactly, because no test can kill it and the reason is
# worth more written down than worked out again.
#
# `single.rs` guards its parse with `needs_facts && is_source`. Widen that to
# `||` and both new paths reach the same answer: with `needs_facts` false the
# facts are computed and never read, and with `is_source` false the parser
# refuses the extension and returns `None` — which is what the guard would have
# produced. The `Single` that comes out is identical either way, so a test
# distinguishing them would have to assert on work done rather than on an
# answer, and that is a test of the implementation.
#
# The guard stays because reading a file to be told it is the wrong kind is
# work with no reason, and on a binary that happened to match a `file_pattern`
# it is a large one. The argument is at the line itself; this entry is the same
# argument in the form the hook can act on.
#
# Second instance of this shape in the project — see M4 in `docs/PLAN-V0.md`
# for the first. A third would be worth a rethink rather than a third entry.
exclude_re = [
    "single\\.rs:\\d+:\\d+: replace && with \\|\\| in check",
]
